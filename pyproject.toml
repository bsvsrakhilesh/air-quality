[project]
name = "axiom-analysis"
version = "0.1.0"
description = "A polished general-purpose statistical analysis workspace"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.12,<1",
    "scipy>=1.13,<2",
    "uvicorn[standard]>=0.30,<1",
    "xlrd>=2,<3",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.7,<1",
]
analytics = [
    "duckdb>=1.1,<2",
    "polars>=1.12,<2",
    "pyarrow>=17,<21",
]
ml = [
    "mlflow>=3,<4",
    "scikit-learn>=1.5,<2",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
exclude = ["backend.tests*"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "B019", # Cached service methods are intentional; services are process singletons.
    "E501", # Let the formatter handle wrapping without obscuring statistical formulas.
]
